name: Sync Fork with Upstream

on:
  schedule:
    - cron: '30 5 */3 * *'
  workflow_dispatch: # Bấm chạy thủ công

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        run: gh repo sync ${{ github.repository }} -b master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
